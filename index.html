<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover (ticket 24): the installed PWA draws edge to edge;
         the safe-area-inset-* envs in src/index.css keep content clear of
         notches and system bars. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Browser-UI tint per OS scheme; the manifest pins the installed app's
         status bar to the dark shell (#15130f). -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fcfcfa"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#15130f"
    />
    <title>pg-backgammon</title>
    <script>
      // Apply the persisted (or OS-preferred) theme before first paint.
      ;(() => {
        let theme = 'light'
        try {
          const stored = localStorage.getItem('pg-backgammon.theme')
          theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        } catch {
          // Storage unavailable: fall back to light.
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
